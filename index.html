<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Programming Hero Assignment - 05</title>

<!-- Tailwind + DaisyUI -->
<link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

<!-- Google Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"/>

<style>

*{
font-family: "Geist", sans-serif;
}

.issue-card{
transition: all .3s ease;
}

.issue-card:hover{
transform: translateY(-6px) scale(1.02);
}

</style>

</head>

<body class="bg-base-200">

<!-- HEADER -->

<header class="bg-base-100 shadow-md px-6 md:px-10 py-4 mb-4 hidden">

<div class="flex flex-col md:flex-row items-center justify-between gap-4">

<h1 class="text-2xl md:text-3xl font-bold">
All Issues
</h1>

<div class="flex items-center gap-3 w-full md:w-auto">

<label class="input input-bordered flex items-center gap-2 w-full md:w-64">

<i class="fa-solid fa-magnifying-glass"></i>

<input id="search-box" type="text" class="grow" placeholder="Search issues..." />

</label>

<button id="search-action"
class="btn btn-primary hover:scale-105 transition">

Search

</button>

</div>

</div>

</header>


<!-- LOGIN SECTION -->

<section id="signin-area">

<div class="hero bg-base-200 min-h-screen">

<div class="hero-content">

<div class="card bg-base-100 w-full max-w-md sm:max-w-lg shadow-2xl">

<div class="card-body p-8 md:p-10">

<div class="flex flex-col items-center text-center mb-6">

<img class="w-20" src="./assets/github-logo.png">

<h1 class="text-2xl font-bold">
GitHub Issues Tracker
</h1>

<p>
Sign in to manage your issues
</p>

</div>

<label class="label text-[16px] text-[#1F2937]">
Username
</label>

<input id="user-field"
type="text"
class="input rounded-md"
placeholder="Enter Username">

<label class="label mt-2 text-[16px] text-[#1F2937]">
Password
</label>

<input id="pass-field"
type="password"
class="input rounded-md"
placeholder="Enter Password">

<button id="signin-btn"
class="btn btn-primary btn-lg mt-4 hover:scale-105 transition">

Sign in

</button>

<div class="flex flex-col items-center text-center mt-6">

<h3 class="font-medium">
OR
</h3>

<span>
Demo Credentials:
</span>

<p>

<span class="font-bold">Username:</span>

<span class="text-black">admin</span>

</p>

<p>

<span class="font-bold">Password:</span>

<span class="text-black">admin123</span>

</p>

</div>

</div>

</div>

</div>

</div>

</section>


<!-- FILTER BUTTONS -->

<section id="filter-section"
class="w-11/12 mx-auto bg-white hidden rounded-lg shadow-sm">

<div class="p-5 flex flex-wrap gap-3">

<button class="btn btn-primary hover:scale-105 transition">
All
</button>

<button class="btn btn-neutral hover:scale-105 transition">
Open
</button>

<button class="btn btn-neutral hover:scale-105 transition">
Closed
</button>

</div>

</section>


<!-- COUNT SECTION -->

<section id="stats-section"
class="w-11/12 mx-auto bg-white rounded-lg p-4 flex flex-col sm:flex-row justify-between items-center mt-3 hidden">

<div class="flex gap-3 items-center">

<div class="w-10 h-10 bg-purple-100 rounded-full flex items-center justify-center">

<img class="w-6" src="./assets/Aperture.png">

</div>

<div>

<h1 id="issue-total"
class="text-lg font-bold">

0 Issues

</h1>

<p class="text-gray-500 text-sm">

Track and manage your project issues

</p>

</div>

</div>


<div class="flex gap-4 items-center mt-3 sm:mt-0">

<span class="flex items-center gap-1 text-sm text-green-700">

<span class="w-2.5 h-2.5 bg-green-600 rounded-full"></span>

Open

</span>

<span class="flex items-center gap-1 text-sm text-purple-700">

<span class="w-2.5 h-2.5 bg-purple-600 rounded-full"></span>

Closed

</span>

</div>

</section>


<!-- SPINNER -->

<section id="loader-box"
class="flex justify-center items-center py-10 hidden">

<span class="loading loading-bars loading-xl"></span>

</section>


<!-- ISSUE CARDS -->

<section id="cards-section"
class="hidden w-11/12 mx-auto">

<div id="card-wrapper"

class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6">

</div>

</section>


<!-- MODAL -->

<dialog id="issue_modal"
class="modal modal-bottom sm:modal-middle px-4 sm:px-0">

<div class="modal-box w-full mx-auto">

<div id="modal-body" class="space-y-5"></div>

<div class="modal-action">

<form method="dialog">

<button class="btn btn-primary hover:scale-105 transition">

Close

</button>

</form>

</div>

</div>

</dialog>


<script src="./JS/script.js"></script>

</body>
</html>
